<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="componentes/favicon.ico">
    <title> Home | Login</title>
</head>
<body>
    <main>
        <div class="main-login">
            <div class="LL">
                <h1>Join our team.<br>Register now! 🪻</h1>
                <img class="LL-image" src="componentes/witch-animate.svg" alt="avatar de bruxa animado by https://storyset.com/illustration/witch/cuate">
            </div>

            <div class="RL">
                <div class="card">
                    <h2>๋࣭ ⭑LOGIN ๋࣭ ⭑</h2>
                    <div class="text-login">
                        <label for="username">Username:</label>
                        <input type="text" name="username" placeholder="Enter your username">
                    </div>
                    <div class="text-login">
                        <label for="password">Password:</label>
                        <input type="password" name="password" placeholder="Enter your password">
                    </div>
                    <button class="btn-1">
                        Login
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
